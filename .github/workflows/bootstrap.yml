name: Bootstrap monitor package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install monitor package
        shell: bash
        env:
          PACKAGE_B64: >-
            
        run: |
          printf '%s' "$PACKAGE_B64" | base64 --decode > package.zip
          unzip -o package.zip
          rm package.zip
          rm .github/workflows/bootstrap.yml
      - name: Commit installed package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Gladkovychi document monitor"
          git push
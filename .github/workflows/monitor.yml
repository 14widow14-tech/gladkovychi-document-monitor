name: Monitor official documents

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "preview-monitoring-original.png"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gladkovychi-document-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      should_commit: ${{ steps.monitor.outputs.should_commit }}
      source_ok: ${{ steps.monitor.outputs.source_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: github.event_name != 'push'
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run monitor
        if: github.event_name != 'push'
        id: monitor
        run: python monitor.py

      - name: Commit material monitoring state
        if: steps.monitor.outputs.should_commit == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json changes.json
          if git diff --cached --quiet; then
            echo "No material state change to commit."
          else
            git commit -m "monitor: update official documents state"
            git pull --rebase
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html status.html state.json changes.json preview-monitoring-original.png _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: monitor
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
